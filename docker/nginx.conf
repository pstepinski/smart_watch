server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate the PWA manifest, service worker and entry point after deployments.
    add_header Cache-Control "no-cache" always;

    # Private dashboard, anonymous opening counts and opted-in visitor statistics.
    location ~ ^/(?:stats/?|api/(?:visits|visitors|stats))$ {
        access_log off;
        proxy_pass http://stats:8080;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        client_max_body_size 128;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing assets must return 404 rather than the SPA's HTML.
    location ~* \.(?:js|css|json|webmanifest|png|svg|ico|txt|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
