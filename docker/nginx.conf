server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate the PWA manifest, service worker and entry point after deployments.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing assets must return 404 rather than the SPA's HTML.
    location ~* \.(?:js|css|json|webmanifest|png|svg|ico|txt|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
